name: SimuLAR CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar versões do lockfile
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes e gerar relatórios
        run: npm test -- --reporter=default --reporter=junit --reporter=json --outputFile.junit=reports/junit.xml --outputFile.json=reports/tests.json

      - name: Gerar build de produção
        run: npm run build

      - name: Salvar relatórios de teste
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Salvar aplicação compilada
        uses: actions/upload-artifact@v4
        with:
          name: simular-dist-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

